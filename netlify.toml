[build]
  functions = "netlify/functions"

# Bump timeout to 26s (Netlify Pro max) for Hercules audits which call Claude API + fetch external URLs.
# Default is 10s which is too short for Claude responses around 1500-2500 tokens.
[functions]
  node_bundler = "esbuild"

[functions."hercules-url-audit"]
  timeout = 26

[functions."hercules-geo-audit"]
  timeout = 26

# Vulcan image generation calls Nano Banana Pro sequentially for multiple posts — needs max timeout.
[functions."vulcan-image"]
  timeout = 26

[functions."vulcan-brand-parse"]
  timeout = 26

[functions."vulcan-video-start"]
  timeout = 26

[functions."vulcan-video-status"]
  timeout = 26

[functions."magnus-plan"]
  timeout = 26

[functions."magnus-execute-task"]
  timeout = 26

[functions."magnus-synthesize"]
  timeout = 26

[functions."magnus-extract-brand"]
  timeout = 26

[functions."magnus-router"]
  timeout = 26

# Blog Content Agent — research (long brief) + image planning/generation need the max.
[functions."blog-research"]
  timeout = 26

[functions."blog-draft"]
  timeout = 26

[functions."blog-images"]
  timeout = 26

# Prevent caching of the main app file so users always get the latest deploy.
# Without this, browsers cache index.html aggressively and users may see stale (or broken) versions for hours.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Allow /book/* and /booking/* pages to be embedded in iframes on third-party sites
[[headers]]
  for = "/book/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-Frame-Options = "ALLOWALL"

[[headers]]
  for = "/booking/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-Frame-Options = "ALLOWALL"

# ── the app has one address ──────────────────────────────────────────────────
# Luke asked "am I supposed to be on giant-reachgiant.netlify.app? I thought we were on a
# subdomain". He was right to ask: the raw Netlify deploy URL serves the identical app, so
# it is possible to spend all day on the wrong one -- and every link copied from there
# carries that host to whoever it is sent to.
#
# Anyone who lands on the deploy URL is moved to the canonical domain. First, because these
# rules are read in order and the first match wins.
#
# Functions are exempt and must stay exempt: a 301 on a POST is not reliably followed, and
# any webhook still registered against the deploy URL would silently stop being delivered.
# A redirect rule was tried here first and does not work: Netlify does not honour a
# full-URL `from` against its OWN *.netlify.app subdomain -- domain-level redirects apply to
# domain aliases, and the default subdomain is the host it is already serving. Measured, not
# assumed: it returned 200 with no Location header. The redirect is done in the page instead
# (see the top of index.html and the standalone pages). Please do not re-add it here.

[[redirects]]
  from = "/share/*"
  to = "/share.html"
  status = 200

[[redirects]]
  from = "/pwshare/*"
  to = "/pw-share.html"
  status = 200

[[redirects]]
  from = "/onboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/book/*"
  to = "/index.html"
  status = 200

# "Sign in with Giant" for AI assistants (MCP authorization).
# These MUST stay above the /oauth/* and /* rules below, which send everything else
# to the app -- an MCP client discovering this server would otherwise be handed
# index.html where it expected JSON, and simply report that Giant is not an MCP server.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp-oauth-prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/mcp-oauth-prm"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp-oauth-as"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server/mcp"
  to = "/.netlify/functions/mcp-oauth-as"
  status = 200

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "/.netlify/functions/mcp-oauth-as"
  status = 200

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/mcp-oauth-authorize"
  status = 200

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/mcp-oauth-token"
  status = 200

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/mcp-oauth-register"
  status = 200

[[redirects]]
  from = "/oauth/revoke"
  to = "/.netlify/functions/mcp-oauth-revoke"
  status = 200

[[redirects]]
  from = "/oauth/*"
  to = "/index.html"
  status = 200

# The MCP endpoint, so what somebody pastes into Claude is giant.reachgiant.com/mcp
# rather than a /.netlify/functions/ path. Must sit ABOVE the SPA catch-all below,
# which would otherwise swallow it and serve index.html to an MCP client.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."share-pack-feedback"]
  timeout = 10

[functions."share-pack-create"]
  timeout = 10

[functions."vulcan-revise"]
  timeout = 26

[functions."vulcan-edit"]
  timeout = 26

# claude-api powers the Report/Template generation from PDF/text. Long PDFs need >10s.
[functions."claude-api"]
  timeout = 26

# Always serve a fresh version.json so the desktop app's update check is accurate.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[functions."hercules-execute"]
  timeout = 26
