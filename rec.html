<!doctype html>
<html lang="en">
<head>
<script>
/* One address for the app. The raw Netlify deploy URL serves the identical site, so it is
   possible to spend all day on the wrong one -- and every link copied from there carries
   that host to whoever it is sent to. Luke asked whether he was supposed to be on it.

   Done here rather than as a Netlify redirect because Netlify does not honour a full-URL
   `from` against its own *.netlify.app subdomain; that was tried and measured returning 200
   with no Location. First thing in the document, before any other script or fetch, so the
   wrong host does no work. replace(), not assign(), so Back does not bounce. */
(function(){
  try {
    if (location.hostname === 'giant-reachgiant.netlify.app') {
      location.replace('https://giant.reachgiant.com'
        + location.pathname + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Screen recording · ReachGiant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rg-red: #D00400;
  --ink: #0A0A0A;
  --paper: #FAFAF8;
  --paper-soft: #F2F1ED;
  --line: rgba(10,10,10,.08);
  --line-strong: rgba(10,10,10,.18);
  --muted: rgba(10,10,10,.55);
}
html, body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.hidden { display: none !important; }
.rg-bar { background: var(--rg-red); color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
.rg-bar-mark { width: 26px; height: 26px; flex-shrink: 0; }
.rg-bar-mark svg { width: 100%; height: 100%; display: block; }
.wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 60px; }
.state-box { background: #fff; border: 1px solid var(--line-strong); border-radius: 14px; padding: 48px 24px; text-align: center; color: var(--muted); font-size: 14px; }
.state-title { font-size: 17px; font-weight: 800; color: var(--ink); margin-bottom: 6px; letter-spacing: -.01em; }
.card { background: #fff; border: 1px solid var(--line-strong); border-radius: 16px; overflow: hidden; }
.player { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
.meta { padding: 18px 20px; display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.meta-title { font-size: 19px; font-weight: 800; letter-spacing: -.015em; word-break: break-word; }
.meta-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.meta-acts { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.btn { border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; background: #fff; color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { background: var(--paper-soft); }
.btn-red { background: var(--rg-red); border-color: var(--rg-red); color: #fff; }
.btn-red:hover { background: #A60300; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 18px; }
@media (max-width: 560px) { .meta-acts { margin-left: 0; width: 100%; } .btn { flex: 1; justify-content: center; } }
</style>
</head>
<body>

  <span class="rg-bar-mark"><svg viewBox="0 0 149 149" fill="none"><rect width="149" height="149" rx="33.44" fill="#fff"/><path d="M38.7805 66.2876V36.3261C38.7805 35.0148 40.4427 34.4493 41.2425 35.4885L75.7656 80.3505C76.1131 80.8021 75.7912 81.456 75.2214 81.456H63.3552C62.5967 81.456 61.9817 82.0709 61.9817 82.8295V114.082C61.9817 115.406 60.293 115.963 59.5048 114.9L26.1264 69.8522C25.4548 68.9457 26.1018 67.661 27.2299 67.661H37.4071C38.1656 67.661 38.7805 67.0461 38.7805 66.2876Z" fill="#D00400"/><path d="M67.0258 61.962L54.9468 45.3534C54.2866 44.4456 54.935 43.1721 56.0575 43.1721H94.9091C95.3384 43.1721 95.7431 43.3729 96.0028 43.7148L121.718 77.5674C122.405 78.4717 121.76 79.7716 120.624 79.7716H99.7764C99.211 79.7716 98.8878 80.4165 99.2262 80.8694L120.696 109.601C121.372 110.506 120.726 111.796 119.595 111.796H98.377C97.9514 111.796 97.5498 111.599 97.2897 111.262L74.4234 81.6323C73.7266 80.7294 74.3702 79.4197 75.5107 79.4197H96.3514C96.9131 79.4197 97.2372 78.7822 96.9063 78.3284L85.7964 63.0919C85.5378 62.7373 85.1254 62.5276 84.6866 62.5276H68.1365C67.6971 62.5276 67.2842 62.3174 67.0258 61.962Z" fill="#D00400"/></svg></span>
  Giant — by ReachGiant
</div>
<div class="wrap">
  <div id="loadingState" class="state-box">Loading recording…</div>
  <div id="errorState" class="state-box hidden">
    <div class="state-title" id="errorTitle">This link does not work</div>
    <div id="errorMessage">The recording may have been deleted, or the link is incomplete.</div>
    <div id="errorActions" style="margin-top:18px;"></div>
  </div>
  <div id="content" class="hidden">
    <div class="card">
      <video id="player" class="player" controls playsinline preload="metadata"></video>
      <div class="meta">
        <div>
          <div class="meta-title" id="title"></div>
          <div class="meta-sub" id="sub"></div>
        </div>
        <div class="meta-acts">
          <button class="btn" id="copyBtn">Copy link</button>
          <a class="btn btn-red" id="dlBtn" download>Download</a>
        </div>
      </div>
    </div>
    <div class="foot">Shared from Giant</div>
  </div>
</div>
<script>
const APP_ORIGIN = window.location.origin;
function getToken(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  const i = parts.indexOf('rec');
  const fromPath = i >= 0 ? parts[i + 1] : parts[parts.length - 1];
  return (fromPath || new URLSearchParams(window.location.search).get('token') || '').trim();
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDur(secs){
  if (secs == null) return '';
  const m = Math.floor(secs / 60), s = secs % 60;
  return m + 'm ' + s + 's';
}
function fail(title, message, actionsHtml){
  document.getElementById('loadingState').classList.add('hidden');
  const box = document.getElementById('errorState');
  box.classList.remove('hidden');
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMessage').textContent = message;
  document.getElementById('errorActions').innerHTML = actionsHtml || '';
}
async function load(){
  const token = getToken();
  if (!token) return fail('This link is incomplete', 'No recording was named in the link.');
  let res;
  try { res = await fetch('/.netlify/functions/recording-share-get?token=' + encodeURIComponent(token)); }
  catch (e) { return fail('Could not load this recording', 'Check your connection and try again.'); }

  if (res.status === 403) {
    // Deliberately not a 404: this recording exists, it just is not public. Anyone with a
    // Giant account can still watch it, so the page says so and sends them there.
    let id = '';
    try { id = (await res.json()).id || ''; } catch (_) {}
    return fail('This recording is for people in Giant',
      'Whoever shared it has kept it inside the workspace. Sign in to Giant to watch it.',
      '<a class="btn btn-red" href="' + APP_ORIGIN + '/?rec=' + encodeURIComponent(id) + '">Open in Giant</a>');
  }
  if (!res.ok) return fail('This link does not work', 'The recording may have been deleted, or the link is incomplete.');

  const rec = await res.json();
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  document.getElementById('player').src = rec.url;
  document.title = (rec.title || 'Screen recording') + ' · ReachGiant';
  document.getElementById('title').textContent = rec.title || 'Screen recording';
  const bits = [];
  if (rec.author) bits.push(rec.author);
  if (rec.created_at) bits.push(new Date(rec.created_at).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }));
  const d = fmtDur(rec.duration_secs); if (d) bits.push(d);
  document.getElementById('sub').textContent = bits.join(' · ');
  const dl = document.getElementById('dlBtn');
  dl.href = rec.url;
  dl.setAttribute('download', (rec.title || 'recording').replace(/[^\w\-]+/g, '_') + '.webm');
  document.getElementById('copyBtn').addEventListener('click', async (e) => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      const b = e.currentTarget, t = b.textContent;
      b.textContent = 'Copied';
      setTimeout(() => { b.textContent = t; }, 1400);
    } catch (_) {}
  });
}
load();
</script>
</body>
