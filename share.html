<script>
/* One address for the app. The raw Netlify deploy URL serves the identical site, so it is
   possible to spend all day on the wrong one -- and every link copied from there carries
   that host to whoever it is sent to. Luke asked whether he was supposed to be on it.

   Done here rather than as a Netlify redirect because Netlify does not honour a full-URL
   `from` against its own *.netlify.app subdomain; that was tried and measured returning 200
   with no Location. First thing in the document, before any other script or fetch, so the
   wrong host does no work. replace(), not assign(), so Back does not bounce. */
(function(){
  try {
    if (location.hostname === 'giant-reachgiant.netlify.app') {
      location.replace('https://giant.reachgiant.com'
        + location.pathname + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rg-red: #D00400;
  --rg-red-dark: #A60300;
  --ink: #0A0A0A;
  --paper: #FAFAF8;
  --paper-soft: #F2F1ED;

  --line-strong: rgba(10,10,10,.18);
  --muted: rgba(10,10,10,.55);
  --green: #15803D;

}
html, body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }

/* Top brand bar */
.rg-bar {
  background: var(--rg-red); color: #fff; padding: 14px 22px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.rg-bar-left { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
.rg-bar-mark { width: 30px; height: 30px; display: grid; place-items: center; flex-shrink: 0; }
.rg-bar-mark svg { width: 100%; height: 100%; display: block; }
.rg-bar-right { font-size: 12px; opacity: .85; font-weight: 500; }
.rg-footer-mark { width: 28px; height: 28px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.rg-footer-mark svg { width: 100%; height: 100%; display: block; }

/* Page header */
.page-head {
  padding: 38px 22px 24px; max-width: 740px; margin: 0 auto;
  border-bottom: 1px solid var(--line);
}
.page-head-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--rg-red); margin-bottom: 12px; }
.page-head h1 { font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; margin-bottom: 10px; }
.page-head-subtitle { font-size: 15px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
.page-head-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; }

.page-head-meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--rg-red); display: inline-block; }

/* Reviewer ID prompt */
.reviewer-prompt {
  max-width: 740px; margin: 24px auto; padding: 18px 22px;
  background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;

.reviewer-prompt-row { display: flex; gap: 10px; align-items: center; }
.reviewer-prompt-input {

}
.reviewer-prompt-input:focus { border-color: var(--rg-red); background: #fff; }
.reviewer-prompt-btn {

  white-space: nowrap; transition: .15s;
}
.reviewer-prompt-btn:hover { background: var(--rg-red-dark); }
.reviewer-prompt-hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

/* Posts list */
.posts-wrap { max-width: 740px; margin: 0 auto; padding: 24px 22px 80px; }
.post-card {
  background: #fff; border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden;
  margin-bottom: 22px;
}
.post-card-num {

.post-card-img { width: 100%; background: var(--paper-soft); display: block; max-height: 70vh; object-fit: contain; }

.post-card-body { padding: 18px 22px 20px; }
.post-card-concept {

}
.post-card-headline { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 10px; }
.post-card-caption { font-size: 14px; line-height: 1.55; color: rgba(10,10,10,.78); margin-bottom: 10px; white-space: pre-wrap; }
.post-card-hashtags { font-size: 13px; color: var(--rg-red); line-height: 1.4; }

.post-actions {

.post-actions-buttons { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.post-action-btn {
  flex: 1; min-width: 120px;
  padding: 11px 14px; font-size: 13px; font-weight: 600; border-radius: 8px;
  border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: .15s;
}
.post-action-btn:hover { border-color: rgba(10,10,10,.4); }
.post-action-btn.approve.active { background: var(--green); border-color: var(--green); color: #fff; }
.post-action-btn.reject.active { background: var(--rg-red); border-color: var(--rg-red); color: #fff; }
.post-comment {
  width: 100%; padding: 11px 14px; font-size: 13.5px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: #fff; resize: vertical; min-height: 70px; line-height: 1.5; outline: none; transition: .15s;
  font-family: inherit;
}
.post-comment:focus { border-color: var(--rg-red); }
.post-comment-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.post-comment-submit {
  background: var(--ink); color: #fff; padding: 9px 14px; font-size: 12.5px; font-weight: 600; border-radius: 7px;
}
.post-comment-submit:hover { background: rgba(10,10,10,.85); }
.post-comment-status { font-size: 11.5px; color: var(--muted); }
.post-comment-status.success { color: var(--green); }
.post-comment-status.error { color: var(--rg-red); }

/* Loading / error states */
.loading, .error-state, .empty-state {
  text-align: center; padding: 80px 22px; color: var(--muted); font-size: 14px;
}
.loading-spinner {
  width: 28px; height: 28px; border: 2.5px solid var(--line-strong); border-top-color: var(--rg-red);
  border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.page-footer {
  text-align: center; padding: 28px 22px 40px; font-size: 11.5px; color: var(--muted);
  border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap;
}
.page-footer a { color: var(--rg-red); text-decoration: none; font-weight: 600; }

@media (max-width: 600px) {
  .page-head { padding: 28px 18px 20px; }
  .page-head h1 { font-size: 26px; }

  .posts-wrap { padding: 18px 14px 60px; }
  .post-card-body, .post-actions { padding-left: 18px; padding-right: 18px; }
}

<script>
// Extract slug from URL: supports /share/abc123 and /share.html?s=abc123
function getSlug() {
  // First, try the path component after /share/
  const m = window.location.pathname.match(/\/share\/([^/?#]+)/);
  if (m) return m[1];
  // Fallback to query param
  const url = new URL(window.location.href);
  return url.searchParams.get('s') || url.searchParams.get('slug') || '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  } catch (e) { return ''; }
}

async function loadPack() {
  const slug = getSlug();
  if (!slug) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorMessage').textContent = 'No share link provided.';
    return;
  }
  try {
    // Anon table access to share_packs is revoked (security batch 1) — packs are read
    // through the share-pack-get function, which enforces expiry and strips internal fields.
    const res = await fetch(`/.netlify/functions/share-pack-get?slug=${encodeURIComponent(slug)}`);
    if (res.status === 410) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = 'This share link has expired.';
      return;
    }
    if (res.status === 404 || res.status === 400) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const pack = data && data.pack;
    if (!pack) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      return;
    }
    renderPack(pack);
  } catch (e) {
    console.error(e);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorMessage').textContent = 'Could not load this share link. ' + (e.message || '');
  }
}

let CURRENT_PACK = null;

function renderPack(pack) {
  CURRENT_PACK = pack;
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  document.title = `${pack.title} · Creative Review`;
  document.getElementById('packTitle').textContent = pack.title || 'Creative Review';
  const subtitle = pack.subtitle || '';
  const subEl = document.getElementById('packSubtitle');
  if (subtitle) { subEl.textContent = subtitle; } else { subEl.style.display = 'none'; }
  const posts = Array.isArray(pack.posts) ? pack.posts : [];
  document.getElementById('packCount').textContent = posts.length + ' post' + (posts.length !== 1 ? 's' : '');
  document.getElementById('packDate').textContent = formatDate(pack.created_at);
  document.getElementById('rgBarMeta').textContent = formatDate(pack.created_at);
  if (pack.client_name) {
    document.getElementById('packClientWrap').style.display = '';
    document.getElementById('packClient').textContent = 'For ' + pack.client_name;
  }
  // Load saved reviewer name
  const savedName = localStorage.getItem('rg_reviewer_name') || '';
  if (savedName) {
    document.getElementById('reviewerPrompt').classList.add('hidden');
  } else {
    document.getElementById('reviewerNameInput').focus();
  }
  document.getElementById('reviewerSaveBtn').addEventListener('click', () => {
    const name = document.getElementById('reviewerNameInput').value.trim();
    if (!name) { document.getElementById('reviewerNameInput').focus(); return; }
    localStorage.setItem('rg_reviewer_name', name);
    document.getElementById('reviewerPrompt').classList.add('hidden');
  });
  document.getElementById('reviewerNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('reviewerSaveBtn').click();
  });
  renderPosts(posts);
}

function renderPosts(posts) {
  const wrap = document.getElementById('postsWrap');
  if (posts.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No posts in this pack.</div>';
    return;
  }
  wrap.innerHTML = posts.map((p, i) => {
    const localStateKey = `rg_post_state_${CURRENT_PACK.slug}_${i}`;
    const savedState = JSON.parse(localStorage.getItem(localStateKey) || '{}');
    const statusLabel = savedState.action === 'approve' ? 'Approved' : savedState.action === 'reject' ? 'Needs work' : '';
    const statusClass = savedState.action === 'approve' ? 'approved' : savedState.action === 'reject' ? 'rejected' : '';
    const concept = (p.concept || '').trim();
    const headline = (p.headline || '').trim();
    const caption = (p.caption || '').trim();
    const hashtags = Array.isArray(p.hashtags) ? p.hashtags.map(h => h.startsWith('#') ? h : '#' + h).join(' ') : (p.hashtags || '');
    const imgHtml = p.image_url
      ? `<img class="post-card-img" src="${escapeHtml(p.image_url)}" alt="Post ${i+1}" />`
      : `<div class="post-card-img-fallback">Image not available</div>`;
    return `
      <div class="post-card" data-index="${i}">
        <div class="post-card-num">
          <span>Post ${i+1} of ${posts.length}</span>
          <span class="post-card-num-status ${statusClass}">${statusLabel}</span>
        </div>
        ${imgHtml}
        <div class="post-card-body">
          ${concept ? `<div class="post-card-concept">${escapeHtml(concept)}</div>` : ''}
          ${headline ? `<div class="post-card-headline">${escapeHtml(headline)}</div>` : ''}
          ${caption ? `<div class="post-card-caption">${escapeHtml(caption)}</div>` : ''}
          ${hashtags ? `<div class="post-card-hashtags">${escapeHtml(hashtags)}</div>` : ''}
        </div>
        <div class="post-actions">
          <div class="post-actions-buttons">
            <button class="post-action-btn approve ${savedState.action === 'approve' ? 'active' : ''}" data-action="approve">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Approve
            </button>
            <button class="post-action-btn reject ${savedState.action === 'reject' ? 'active' : ''}" data-action="reject">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Needs work
            </button>
          </div>
          <textarea class="post-comment" placeholder="Optional comment — what's working, what to change…" maxlength="2000">${escapeHtml(savedState.comment || '')}</textarea>
          <div class="post-comment-actions">
            <button class="post-comment-submit">Send comment</button>
            <span class="post-comment-status"></span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Wire all posts
  wrap.querySelectorAll('.post-card').forEach((card) => {
    const idx = parseInt(card.dataset.index);
    card.querySelectorAll('.post-action-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAction(card, idx, btn.dataset.action));
    });
    card.querySelector('.post-comment-submit').addEventListener('click', () => handleComment(card, idx));
  });
}

async function ensureReviewerName() {
  // Reviewer name is OPTIONAL — return whatever is in localStorage, or empty string.
  // We never block actions on missing name; the user can leave it blank if they want to stay anonymous.
  return (localStorage.getItem('rg_reviewer_name') || '').trim() || null;
}

async function handleAction(card, postIndex, action) {
  const reviewerName = await ensureReviewerName();
  const slug = CURRENT_PACK.slug;
  const statusEl = card.querySelector('.post-comment-status');
  statusEl.className = 'post-comment-status';
  statusEl.textContent = 'Sending…';
  try {
    const res = await fetch('/.netlify/functions/share-pack-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, post_index: postIndex, action, reviewer_name: reviewerName })
    });
    let data = null;
    const rawText = await res.text();
    try { data = JSON.parse(rawText); } catch (e) { data = null; }
    if (!res.ok || !data || data.error) {
      const errMsg = data?.error || (rawText.trim().startsWith('<') ? 'server returned HTML (function not deployed?)' : `HTTP ${res.status}`);
      throw new Error(errMsg);
    }
    // Update UI state
    card.querySelectorAll('.post-action-btn').forEach(b => b.classList.remove('active'));
    card.querySelector(`.post-action-btn[data-action="${action}"]`).classList.add('active');
    const statusBadge = card.querySelector('.post-card-num-status');
    if (action === 'approve') { statusBadge.className = 'post-card-num-status approved'; statusBadge.textContent = 'Approved'; }
    else { statusBadge.className = 'post-card-num-status rejected'; statusBadge.textContent = 'Needs work'; }
    // Persist locally
    const localStateKey = `rg_post_state_${slug}_${postIndex}`;
    const existing = JSON.parse(localStorage.getItem(localStateKey) || '{}');
    existing.action = action;
    localStorage.setItem(localStateKey, JSON.stringify(existing));
    statusEl.className = 'post-comment-status success';
    statusEl.textContent = action === 'approve' ? '✓ Approval recorded.' : '✓ Feedback recorded.';
    setTimeout(() => { statusEl.textContent = ''; }, 3500);
  } catch (e) {
    statusEl.className = 'post-comment-status error';
    statusEl.textContent = '⚠ Could not save: ' + (e.message || 'unknown error');
    console.error('[share] handleAction error:', e);
  }
}

async function handleComment(card, postIndex) {
  const reviewerName = await ensureReviewerName();
  const slug = CURRENT_PACK.slug;
  const commentEl = card.querySelector('.post-comment');
  const comment = commentEl.value.trim();
  if (!comment) { commentEl.focus(); return; }
  const statusEl = card.querySelector('.post-comment-status');
  statusEl.className = 'post-comment-status';
  statusEl.textContent = 'Sending…';
  try {
    const res = await fetch('/.netlify/functions/share-pack-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, post_index: postIndex, action: 'comment', comment, reviewer_name: reviewerName })
    });
    let data = null;
    const rawText = await res.text();
    try { data = JSON.parse(rawText); } catch (e) { data = null; }
    if (!res.ok || !data || data.error) {
      const errMsg = data?.error || (rawText.trim().startsWith('<') ? 'server returned HTML (function not deployed?)' : `HTTP ${res.status}`);
      throw new Error(errMsg);
    }
    const localStateKey = `rg_post_state_${slug}_${postIndex}`;
    const existing = JSON.parse(localStorage.getItem(localStateKey) || '{}');
    existing.comment = comment;
    localStorage.setItem(localStateKey, JSON.stringify(existing));
    statusEl.className = 'post-comment-status success';
    statusEl.textContent = '✓ Comment sent.';
    setTimeout(() => { statusEl.textContent = ''; }, 3500);
  } catch (e) {
    statusEl.className = 'post-comment-status error';
    statusEl.textContent = '⚠ Could not send: ' + (e.message || 'unknown error');
    console.error('[share] handleComment error:', e);
  }
}

loadPack();
</script>
